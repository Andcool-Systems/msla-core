name: Release daemon

on:
  push:
    tags:
      - "daemon-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#daemon-v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Install cargo-edit
        run: cargo install cargo-edit

      - name: Set daemon version
        run: |
          cargo set-version \
            --package msla-daemon \
            "${{ steps.version.outputs.version }}"

      - name: Build daemon
        run: |
          cargo zigbuild \
            --release \
            --target aarch64-unknown-linux-gnu \
            --package msla-daemon \
            --bin msla-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist

          cp \
            target/aarch64-unknown-linux-gnu/release/msla-daemon \
            "dist/msla-daemon-v${{ steps.version.outputs.version }}-aarch64-unknown-linux-gnu"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: msla-daemon ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/msla-daemon-v${{ steps.version.outputs.version }}-aarch64-unknown-linux-gnu